name: Monorepo CI

on:
  push:
    branches: [main, feat/*, fix/*, sakib_codebase]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Lint (${{ matrix.app.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: 'Main Website (yukthimantra.com)'
            dir: 'yukthimantra.com'
          - name: 'Academy Platform (app.yukthimantra.com)'
            dir: 'app.yukthimantra.com'
          - name: 'Events Portal (events.yukthimantra.com)'
            dir: 'events.yukthimantra.com'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app.dir }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ matrix.app.dir }}
        run: npm ci || npm install

      - name: Run Typecheck and Lint
        working-directory: ${{ matrix.app.dir }}
        run: npm run lint

      - name: Build Application
        working-directory: ${{ matrix.app.dir }}
        run: npm run build
